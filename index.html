<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>高一文商总平均计算器</title>
    <style>
/* Google Font */
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Orbitron', sans-serif;
    min-height:100vh;
    padding:40px 20px;

    background:
        radial-gradient(circle at top left,#00f7ff33,transparent 35%),
        radial-gradient(circle at bottom right,#ff00ff22,transparent 35%),
        linear-gradient(135deg,#050816,#0b1120,#111827);

    color:white;
}

/* Main Container */
.container{
    max-width:1000px;
    margin:auto;

    background:rgba(255,255,255,0.05);

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);

    border:1px solid rgba(255,255,255,0.12);

    border-radius:25px;

    padding:35px;

    box-shadow:
        0 0 25px rgba(0,255,255,0.15),
        0 0 80px rgba(0,255,255,0.08);
}

/* Title */
h1{
    text-align:center;
    font-size:2.5rem;
    margin-bottom:10px;

    background:linear-gradient(
        90deg,
        #00f5ff,
        #4dffb8,
        #ff4dff
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    text-shadow:
        0 0 15px rgba(0,255,255,0.6);
}

p{
    text-align:center;
    color:#94a3b8;
}

/* Semester Cards */
.semester{
    margin-top:30px;

    background:rgba(255,255,255,0.04);

    border:1px solid rgba(255,255,255,0.08);

    border-radius:20px;

    padding:25px;

    transition:0.4s;
}

.semester:hover{
    transform:translateY(-4px);

    box-shadow:
        0 0 30px rgba(0,255,255,0.18);
}

.semester h2{
    margin-bottom:20px;

    color:#00f5ff;

    border-bottom:1px solid rgba(0,245,255,.4);

    padding-bottom:10px;
}

/* Subjects Grid */
.subject-group{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:16px;
}

/* Subject Card */
.subject{
    background:rgba(255,255,255,0.04);

    border:1px solid rgba(255,255,255,0.08);

    border-radius:14px;

    padding:12px;

    transition:.3s;
}

.subject:hover{
    border-color:#00f5ff;

    box-shadow:
        0 0 15px rgba(0,245,255,.25);
}

label{
    display:block;
    margin-bottom:8px;

    font-size:13px;

    color:#cbd5e1;
}

/* Futuristic Inputs */
input{
    width:100%;
    padding:12px;

    border-radius:12px;

    border:1px solid rgba(255,255,255,.12);

    background:rgba(0,0,0,.35);

    color:white;

    font-size:15px;
    text-align:center;

    transition:.3s;
}

input:focus{
    outline:none;

    border-color:#00f5ff;

    box-shadow:
        0 0 15px rgba(0,245,255,.4);

    background:rgba(0,0,0,.55);
}

/* Buttons */
button{
    border:none;

    border-radius:15px;

    padding:14px 28px;

    font-size:15px;
    font-weight:600;

    cursor:pointer;

    color:white;

    transition:.35s;
}

/* Cyan Button */
button{
    background:linear-gradient(
        135deg,
        #00e5ff,
        #00bcd4
    );

    box-shadow:
        0 0 20px rgba(0,229,255,.35);
}

button:hover{
    transform:translateY(-3px);

    box-shadow:
        0 0 30px rgba(0,229,255,.6);
}

/* Blue Button */
button.second{
    background:linear-gradient(
        135deg,
        #3b82f6,
        #2563eb
    );

    box-shadow:
        0 0 20px rgba(59,130,246,.35);
}

/* Final Button */
button.final{
    background:linear-gradient(
        135deg,
        #ff00cc,
        #7c3aed
    );

    font-size:18px;

    box-shadow:
        0 0 30px rgba(255,0,204,.45);
}

button.final:hover{
    box-shadow:
        0 0 40px rgba(255,0,204,.75);
}

.center{
    text-align:center;
    margin-top:20px;
}

/* Result Panel */
#result{
    margin-top:30px;

    background:rgba(0,255,170,.08);

    border:1px solid rgba(0,255,170,.2);

    border-radius:20px;

    padding:25px;

    color:#00ffcc;

    font-size:20px;
    font-weight:700;

    white-space:pre-line;

    box-shadow:
        0 0 25px rgba(0,255,170,.15);
}

.final-result{
    background:rgba(255,0,204,.08);

    border-color:rgba(255,0,204,.25);

    color:#ff66d9;

    box-shadow:
        0 0 35px rgba(255,0,204,.2);
}

/* Scrollbar */
::-webkit-scrollbar{
    width:10px;
}

::-webkit-scrollbar-track{
    background:#0f172a;
}

::-webkit-scrollbar-thumb{
    background:linear-gradient(
        #00f5ff,
        #ff00cc
    );
    border-radius:10px;
}
.bg-grid{
    position:fixed;
    inset:0;

    background-image:
        linear-gradient(rgba(0,255,255,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,255,.05) 1px, transparent 1px);

    background-size:40px 40px;

    pointer-events:none;

    z-index:-1;
}
    </style>
</head>

<body>
    <div class="bg-grid"></div>
    <div class="container">
        <h1>🏫 高一文商总平均计算器</h1>
        <p style="text-align: center; color: #666;">根据宽柔中学计算方法</p>

        <!-- 上半年成绩 -->
        <div class="semester">
            <h2>📚 上半年成绩</h2>
            <div class="subject-group">
                <div class="subject"><label>数学 (MT):</label><input type="number" id="math1" value="" min="0" max="100">
                </div>
                <div class="subject"><label>地理 (GEO):</label><input type="number" id="geo1" value="" min="0" max="100">
                </div>
                <div class="subject"><label>华文 (CH):</label><input type="number" id="ch1" value="" min="0" max="100">
                </div>
                <div class="subject"><label>马来文 (BM):</label><input type="number" id="bm1" value="" min="0" max="100">
                </div>
                <div class="subject"><label>英文 (ENG):</label><input type="number" id="eng1" value="" min="0" max="100">
                </div>
                <div class="subject"><label>历史 (HIS):</label><input type="number" id="his1" value="" min="0" max="100">
                </div>
                <div class="subject"><label>美术 (ART):</label><input type="number" id="art1" value="" min="0" max="100">
                </div>
                <div class="subject"><label>电脑 (COMPU):</label><input type="number" id="compu1" value="" min="0"
                        max="100"></div>
                <div class="subject"><label>体育 (PE):</label><input type="number" id="pe1" value="" min="0" max="100">
                </div>
                <div class="subject"><label>联课 (CO):</label><input type="number" id="co1" value="" min="0" max="100">
                </div>
                <div class="subject"><label>会计学 (AC):</label><input type="number" id="ac1" value="" min="0" max="100">
                </div>
                <div class="subject"><label>商业学 (CS):</label><input type="number" id="cs1" value="" min="0" max="100">
                </div>
                <div class="subject"><label>SEJARAH (HISm):</label><input type="number" id="hism1" value="" min="0"
                        max="100"></div>
                <div class="subject"><label>家政 (HOMESC):</label><input type="number" id="homesc1" value="" min="0"
                        max="100"></div>
            </div>
            <div class="center">
                <button id="btn1">计算上半年成绩</button>
            </div>
        </div>

        <!-- 下半年成绩 -->
        <div class="semester">
            <h2>📖 下半年成绩</h2>
            <div class="subject-group">
                <div class="subject"><label>数学 (MT):</label><input type="number" id="math2" value="" min="0" max="100">
                </div>
                <div class="subject"><label>地理 (GEO):</label><input type="number" id="geo2" value="" min="0" max="100">
                </div>
                <div class="subject"><label>华文 (CH):</label><input type="number" id="ch2" value="" min="0" max="100">
                </div>
                <div class="subject"><label>马来文 (BM):</label><input type="number" id="bm2" value="" min="0" max="100">
                </div>
                <div class="subject"><label>英文 (ENG):</label><input type="number" id="eng2" value="" min="0" max="100">
                </div>
                <div class="subject"><label>历史 (HIS):</label><input type="number" id="his2" value="" min="0" max="100">
                </div>
                <div class="subject"><label>美术 (ART):</label><input type="number" id="art2" value="" min="0" max="100">
                </div>
                <div class="subject"><label>电脑 (COMPU):</label><input type="number" id="compu2" value="" min="0"
                        max="100"></div>
                <div class="subject"><label>体育 (PE):</label><input type="number" id="pe2" value="" min="0" max="100">
                </div>
                <div class="subject"><label>联课 (CO):</label><input type="number" id="co2" value="" min="0" max="100">
                </div>
                <div class="subject"><label>会计学 (AC):</label><input type="number" id="ac2" value="" min="0" max="100">
                </div>
                <div class="subject"><label>商业学 (CS):</label><input type="number" id="cs2" value="" min="0" max="100">
                </div>
                <div class="subject"><label>SEJARAH (HISm):</label><input type="number" id="hism2" value="" min="0"
                        max="100"></div>
                <div class="subject"><label>家政 (HOMESC):</label><input type="number" id="homesc2" value="" min="0"
                        max="100"></div>
            </div>
            <div class="center">
                <button id="btn2" class="second">计算下半年成绩</button>
            </div>
        </div>

        <!-- 最终计算 -->
        <div class="center">
            <button id="btnFinal" class="final">计算最终总平均</button>
        </div>

        <div id="result"></div>
    </div>

    <script>
        // 使用事件监听器确保按钮工作
        document.getElementById('btn1').addEventListener('click', function () {
            calculateSemester(1);
        });

        document.getElementById('btn2').addEventListener('click', function () {
            calculateSemester(2);
        });

        document.getElementById('btnFinal').addEventListener('click', calculateFinal);

        let sem1Result = 0;
        let sem2Result = 0;

        function calculateSemester(semester) {
            alert("正在计算第" + semester + "学期成绩...");

            // 获取所有科目分数
            const math = parseFloat(document.getElementById('math' + semester).value) || 0;
            const geo = parseFloat(document.getElementById('geo' + semester).value) || 0;
            const ch = parseFloat(document.getElementById('ch' + semester).value) || 0;
            const bm = parseFloat(document.getElementById('bm' + semester).value) || 0;
            const eng = parseFloat(document.getElementById('eng' + semester).value) || 0;
            const his = parseFloat(document.getElementById('his' + semester).value) || 0;
            const art = parseFloat(document.getElementById('art' + semester).value) || 0;
            const compu = parseFloat(document.getElementById('compu' + semester).value) || 0;
            const pe = parseFloat(document.getElementById('pe' + semester).value) || 0;
            const co = parseFloat(document.getElementById('co' + semester).value) || 0;
            const ac = parseFloat(document.getElementById('ac' + semester).value) || 0;
            const cs = parseFloat(document.getElementById('cs' + semester).value) || 0;
            const hism = parseFloat(document.getElementById('hism' + semester).value) || 0;
            const homesc = parseFloat(document.getElementById('homesc' + semester).value) || 0;

            // 计算公式
            const total = (ch * 6 + bm * 6 + eng * 6 + math * 6 + his * 3 + geo * 3 +
                art * 1 + compu * 2 + pe * 1 + co * 3 + ac * 4 + homesc * 1 +
                cs * 2 + hism * 1) / 45;

            if (semester === 1) {
                sem1Result = total;
            } else {
                sem2Result = total;
            }

            document.getElementById('result').innerHTML = "第" + semester + "学期成绩: " + total.toFixed(2);
            alert("第" + semester + "学期成绩: " + total.toFixed(2));
        }

        function calculateFinal() {
            if (sem1Result === 0 || sem2Result === 0) {
                alert("请先计算两个学期的成绩！");
                return;
            }

            const final = (sem1Result + sem2Result) / 2;
            document.getElementById('result').innerHTML =
                "上半年成绩: " + sem1Result.toFixed(2) + "\n" +
                "下半年成绩: " + sem2Result.toFixed(2) + "\n" +
                "最终总平均: " + final.toFixed(2);

            document.getElementById('result').classList.add('final-result');
        }
    </script>
</body>

</html>
